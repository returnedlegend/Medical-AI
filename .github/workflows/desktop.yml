name: Build Windows desktop application

on:
  workflow_dispatch:
  push:
    tags: ['desktop-v*']
    branches: [main]
    paths:
      - 'desktop/**'
      - 'backend/**'
      - 'frontend/**'
      - 'docs/**'
      - 'examples/**'
      - 'README.md'
      - 'scripts/build-desktop.py'
      - '.github/workflows/desktop.yml'

permissions:
  contents: read

jobs:
  windows-desktop:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # 3.12.10 is the latest 3.12 Windows binary in the actions tool cache.
          python-version: '3.12.10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install desktop dependencies
        run: python -m pip install -r backend/requirements-desktop.txt
      - name: Test desktop lifecycle and resources
        run: python -m pytest desktop/tests -q
      - name: Build Windows executable and interface
        run: python scripts/build-desktop.py --require-reference
      - name: Check packaged service, replay and actual DQN training
        shell: pwsh
        run: |
          $evidence = Join-Path $env:RUNNER_TEMP 'retraction-desktop-diagnose.json'
          $data = Join-Path $env:RUNNER_TEMP 'retraction-desktop-diagnose-data'
          $process = Start-Process -FilePath 'artifacts/desktop/windows/RetractionLab/RetractionLab.exe' -ArgumentList @('--diagnose', $evidence, '--data-dir', $data) -PassThru
          if (-not $process.WaitForExit(180000)) {
            $process.Kill($true)
            throw 'Packaged service diagnosis timed out'
          }
          if ($process.ExitCode -ne 0) { throw "Service diagnosis exited $($process.ExitCode)" }
          $result = Get-Content $evidence -Raw | ConvertFrom-Json
          if ($result.status -ne 'passed' -or -not $result.packaged -or -not $result.checks.physics_source_provenance) { throw 'Packaged model diagnosis did not pass' }
      - name: Exercise the packaged native application
        shell: pwsh
        run: |
          $evidence = Join-Path $env:RUNNER_TEMP 'retraction-desktop-smoke.json'
          $data = Join-Path $env:RUNNER_TEMP 'retraction-desktop-data'
          $process = Start-Process -FilePath 'artifacts/desktop/windows/RetractionLab/RetractionLab.exe' -ArgumentList @('--smoke-test', $evidence, '--data-dir', $data, '--software-rendering') -PassThru
          if (-not $process.WaitForExit(120000)) {
            $process.Kill($true)
            throw 'Packaged application smoke test timed out'
          }
          if ($process.ExitCode -ne 0) { throw "Native application exited $($process.ExitCode)" }
          $result = Get-Content $evidence -Raw | ConvertFrom-Json
          if ($result.status -ne 'passed' -or -not $result.packaged) { throw 'Native smoke evidence did not pass' }
      - name: Upload Windows application and checksums
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RetractionLab-windows-x64
          path: |
            artifacts/desktop/windows/RetractionLab-windows-x64.zip
            artifacts/desktop/windows/RetractionLab-windows-x64.zip.sha256
            artifacts/desktop/windows/build-manifest.json
          retention-days: 14
      - name: Preserve desktop smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-smoke-evidence
          path: |
            ${{ runner.temp }}/retraction-desktop-smoke.*
            ${{ runner.temp }}/retraction-desktop-diagnose.json
            ${{ runner.temp }}/retraction-installed-diagnose.json
            ${{ runner.temp }}/retraction-installer-smoke.json
            ${{ runner.temp }}/retraction-desktop-data/logs/
      - name: Publish desktop check summary
        if: always()
        shell: pwsh
        run: |
          foreach ($name in @('retraction-desktop-diagnose.json', 'retraction-desktop-smoke.json', 'retraction-installed-diagnose.json', 'retraction-installer-smoke.json')) {
            $path = Join-Path $env:RUNNER_TEMP $name
            if (Test-Path $path) {
              $json = Get-Content $path -Raw
              if ($json.Length -gt 20000) { $json = $json.Substring(0, 20000) + "`n[truncated]" }
              @("### $name", '```json', $json, '```') | Add-Content $env:GITHUB_STEP_SUMMARY
            }
          }

  assemble-installer:
    runs-on: ubuntu-24.04
    needs: windows-desktop
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: RetractionLab-windows-x64
          path: artifacts/desktop/windows
      - name: Verify and extract the genuinely Windows-built application
        run: |
          python - <<'PY'
          import hashlib, json, pathlib, zipfile
          output = pathlib.Path('artifacts/desktop/windows')
          manifest = json.loads((output / 'build-manifest.json').read_text())
          archive = output / 'RetractionLab-windows-x64.zip'
          if hashlib.sha256(archive.read_bytes()).hexdigest() != manifest['archive_sha256']:
              raise SystemExit('Windows application archive checksum mismatch')
          with zipfile.ZipFile(archive) as bundle:
              bundle.extractall(output)
          PY
      - name: Fetch and verify exact Debian NSIS 3.11 compiler
        run: python -m desktop.fetch_nsis --output-dir .build/verified-nsis
      - name: Assemble the Windows installer
        env:
          NSISDIR: ${{ github.workspace }}/.build/verified-nsis/usr/share/nsis
        run: >-
          python -m desktop.build_installer
          --bundle artifacts/desktop/windows/RetractionLab
          --work-dir .build/desktop/windows/installer
          --makensis .build/verified-nsis/usr/bin/makensis
          --compiler-provenance .build/verified-nsis/compiler-provenance.json
      - name: Upload installer and verified compiler provenance
        uses: actions/upload-artifact@v4
        with:
          name: RetractionLab-windows-x64-Setup
          path: |
            artifacts/desktop/windows/*-Setup.exe
            artifacts/desktop/windows/*-Setup.exe.sha256
            artifacts/desktop/windows/build-manifest.json
          retention-days: 14

  windows-installer:
    runs-on: windows-latest
    needs: assemble-installer
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: RetractionLab-windows-x64-Setup
          path: artifacts/desktop/windows
      - name: Check installer, installed models and safe uninstallation
        shell: pwsh
        run: |
          try {
            $install = Join-Path $env:RUNNER_TEMP 'Retraction Lab Install'
            $data = Join-Path $env:RUNNER_TEMP 'Retraction Lab Persistent Studies'
            $evidence = Join-Path $env:RUNNER_TEMP 'retraction-installed-diagnose.json'
            $setup = Get-ChildItem 'artifacts/desktop/windows/*-Setup.exe' | Select-Object -First 1
            if (-not $setup) { throw 'Setup.exe was not produced' }
            $process = Start-Process -FilePath $setup.FullName -ArgumentList "/S /D=$install" -PassThru
            if (-not $process.WaitForExit(180000)) { $process.Kill($true); throw 'Installation timed out' }
            if ($process.ExitCode -ne 0) { throw "Installer exited $($process.ExitCode)" }
            $program = Join-Path $install 'RetractionLab.exe'
            if (-not (Test-Path $program)) { throw 'Installed executable missing' }
            $process = Start-Process -FilePath $program -ArgumentList @('--diagnose', "`"$evidence`"", '--data-dir', "`"$data`"") -PassThru
            if (-not $process.WaitForExit(180000)) { $process.Kill($true); throw 'Installed model diagnosis timed out' }
            if ($process.ExitCode -ne 0) { throw "Installed diagnosis exited $($process.ExitCode)" }
            $result = Get-Content $evidence -Raw | ConvertFrom-Json
            if ($result.status -ne 'passed' -or -not $result.packaged) { throw 'Installed models did not pass' }
            $before = @{}
            Get-ChildItem $data -Recurse -Filter '*.sqlite3' | ForEach-Object { $before[$_.FullName] = (Get-FileHash $_.FullName -Algorithm SHA256).Hash }
            if ($before.Count -lt 3) { throw 'Expected cohort, learning and procedure study databases' }
            Set-Content (Join-Path $install 'keep-me.txt') 'unrelated file'
            Set-Content (Join-Path $install '_internal/keep-me.txt') 'unrelated nested file'
            $process = Start-Process -FilePath (Join-Path $install 'Uninstall.exe') -ArgumentList '/S' -PassThru
            if (-not $process.WaitForExit(90000)) { $process.Kill($true); throw 'Uninstaller timed out' }
            $deadline = (Get-Date).AddSeconds(60)
            while ((Test-Path $program) -and (Get-Date) -lt $deadline) { Start-Sleep -Milliseconds 200 }
            if (Test-Path $program) { throw 'Uninstaller left the application executable' }
            if (-not (Test-Path (Join-Path $install 'keep-me.txt'))) { throw 'Uninstaller deleted an unrelated file' }
            if (-not (Test-Path (Join-Path $install '_internal/keep-me.txt'))) { throw 'Uninstaller deleted an unrelated nested file' }
            foreach ($database in $before.Keys) {
              if (-not (Test-Path $database) -or (Get-FileHash $database -Algorithm SHA256).Hash -ne $before[$database]) { throw 'Uninstallation changed persistent studies' }
            }
            @{ status = 'passed'; per_user_install = $true; installed_models = $true; studies_preserved = $true; unrelated_files_preserved = $true } | ConvertTo-Json | Set-Content (Join-Path $env:RUNNER_TEMP 'retraction-installer-smoke.json')
          } catch {
            $message = $_.Exception.Message.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Installed Windows application check failed::$message"
            throw
          }
      - name: Preserve installed application evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-smoke-evidence
          path: |
            ${{ runner.temp }}/retraction-installed-diagnose.json
            ${{ runner.temp }}/retraction-installer-smoke.json
            ${{ runner.temp }}/Retraction Lab Persistent Studies/logs/
          retention-days: 14
