name: Validate MVP
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install and build
        run: scripts/setup.sh
      - name: Test and typecheck
        run: scripts/check.sh
      - name: Summarize backend test evidence
        if: always()
        run: python scripts/summarize_test_results.py
      - name: Install browser test dependencies
        run: |
          .venv/bin/python -m pip install -r backend/requirements-browser.txt
          .venv/bin/python scripts/ci_browser_checks.py --prepare-browser
      - name: Browser smoke test
        run: |
          ./scripts/start.sh > /tmp/retraction-server.log 2>&1 &
          service_pid=$!
          trap 'kill "$service_pid"' EXIT
          .venv/bin/python - <<'PY'
          import time
          import urllib.request
          deadline = time.monotonic() + 30
          while True:
              try:
                  with urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2) as response:
                      assert response.status == 200
                  break
              except OSError:
                  if time.monotonic() >= deadline:
                      raise
                  time.sleep(.2)
          PY
          .venv/bin/python scripts/ci_browser_checks.py
      - name: Keep browser evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: |
            /tmp/retraction-browser-smoke
            /tmp/retraction-server.log
            /tmp/retraction-accessibility
            /tmp/retraction-procedure-browser
            /tmp/retraction-ci-browser
            test-results/backend.xml
